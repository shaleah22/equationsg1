<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equations Study Guide #1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the test question in a Canvas-style card on the left; on the right, the class drill that fits
   that kind of question (two-step, inequalities, or clearing / both sides) works it with the student. */
:root{
  --ink:#0f172a; --text:#334155; --muted:#5b6474; --faint:#94a3b8; --line:#d5dbe3; --edge:#e5e9ef;
  --page:#f3f5f8; --paper:#ffffff;
  --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff;
  --green:#047857; --green-b:#10b981; --green-bg:#ecfdf5;
  --rose:#be123c; --rose-b:#fb7185; --rose-bg:#fff1f2;
  --canvas-head:#f5f5f5; --canvas-edge:#c7cdd1;
  --f-ui:Tahoma,Verdana,"DejaVu Sans",Geneva,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:clamp(15px,.5vw + .7vh,19px);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;flex-shrink:0;padding-bottom:6px;border-bottom:2px solid var(--edge)}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand-k{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.brand-t{font-size:1.1rem;font-weight:700}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.score{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{color:var(--muted);font-weight:600}
.btn{font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:8px;cursor:pointer;background:var(--paper);color:var(--blue);border:2px solid #bfdbfe}
.btn:hover{background:var(--blue-bg);border-color:var(--blue-b)}
.btn.go{color:var(--green);border-color:#a7f3d0}
.btn.go:hover{background:var(--green-bg);border-color:var(--green-b)}
.strip{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;flex-shrink:0}
.strip .lab{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:4px}
.qn{min-width:2em;height:1.85em;border-radius:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.qn:hover{border-color:var(--blue-b);color:var(--blue)}
.qn.right{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.qn.on{outline:3px solid var(--blue);outline-offset:1px}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.qcol{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
/* the problem: a bar across the top of the workspace */
.qbar{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px 20px;padding:10px 18px;border-bottom:1px solid var(--line);background:#fbfcfd;max-height:42vh;overflow-y:auto}
.qcard{flex:1;min-width:0;display:flex;align-items:flex-start;gap:16px}
.stagebody{flex:1;min-height:0;position:relative}
.qhead{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;font-weight:700;white-space:nowrap;padding-right:16px;border-right:2px solid var(--edge);line-height:1.3}
.qhead .pts{font-weight:600;color:var(--muted);font-size:.9rem}
.qbody{flex:1;min-width:0;line-height:1.5;max-width:62rem}
.qbody .blank{display:none}
.qbody .prevans{display:inline-block;margin:4px 0 0;padding:3px 10px;border-radius:6px;background:var(--blue-bg);color:var(--blue)}
.qcard.ineng .qeq{display:none}
.qcard.bare .qbody{display:none}
.qcard.bare .qhead{border-right:0;flex-direction:row;gap:10px}
.qbody p{margin:0 0 .6em}
.qbody p:last-child{margin-bottom:0}
.sawc{font-size:.76rem;font-weight:700;margin-bottom:.6em}
.qeq{font-size:1.4rem;font-weight:700;margin:.3em 0 .5em;display:flex;flex-wrap:wrap;align-items:center;gap:.25em}
.blank{color:var(--muted)}
.qt{border-collapse:collapse;margin:.2em 0 .8em;font-size:.95rem}
.qt th,.qt td{border:1px solid #9aa3ad;padding:5px 9px;text-align:left;vertical-align:top}
.qt th{background:#eef0f2}
.m{font-weight:700;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.78em;line-height:1.12;margin:0 .06em}
.fr>.ft{padding:0 .14em}
.fr>.frb{padding:0 .14em;border-top:2px solid currentColor}
.status{flex:0 1 19rem;border-left:4px solid var(--blue-b);padding:2px 0 2px 12px;color:var(--text);line-height:1.4;font-size:.86rem}
.status:empty{display:none}
.status.done{border-left-color:var(--green-b)}
.status b{color:var(--ink)}
.status .ok{color:var(--green);font-weight:700;font-size:1.15rem}
.status .note{color:var(--muted);font-size:.9rem}
.stage{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#frames,#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#frames iframe{background:#fff}
.hpanel{position:absolute;inset:0;overflow:auto;padding:24px clamp(14px,3vw,36px);display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--paper)}
.hp-lab{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--blue)}
.hp-q{margin:0;font-size:1.2rem;font-weight:700;line-height:1.45;text-align:center;max-width:40rem;text-wrap:balance}
.hp-fb{margin:0;color:var(--rose);font-weight:700;text-align:center;max-width:40rem;line-height:1.45}
.hp-done{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--green);font-weight:700}
.hp-done .big{font-size:1.6rem}
.opts{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:40rem}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.2rem;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
.ctab{border-collapse:collapse;font-size:1rem;margin:0 auto}
.ctab th,.ctab td{border:1.5px solid var(--line);padding:7px 12px;text-align:center;min-width:5.5em;white-space:nowrap}
.ctab tr:first-child th{font-size:.85rem;color:var(--muted);background:var(--canvas-head)}
.ctab th{text-align:left;background:var(--canvas-head)}
.ctab td.got{font-weight:700;color:var(--ink)}
.ctab td.now{background:var(--blue-bg);color:var(--blue);font-weight:700;outline:2px solid var(--blue-b);outline-offset:-2px}
.ctab tr.tot td,.ctab tr.tot th{border-top-width:3px}
.menu{font:700 1.15rem var(--f-ui);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 14px;min-width:16rem;cursor:pointer}
.menu:focus{border-color:var(--blue-b)}
.opt:hover{border-color:var(--blue-b);background:var(--blue-bg)}
.opt.wrong{border-color:var(--rose-b);color:var(--rose);opacity:.55;cursor:default;text-decoration:line-through}
.opt .lt{flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:.9rem}
.fields{display:flex;flex-direction:column;gap:12px;width:100%;max-width:34rem}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:1.15rem;font-weight:700}
.box{height:2.2em;width:6em;font-size:1.1rem;font-weight:700;text-align:center;border:2px solid #10b981;background:#fff;color:var(--green);border-radius:6px;outline:none}
.box:focus{border-color:var(--green)}
.box.ok{background:var(--green-bg)}
.box.bad{border-color:var(--rose-b);background:var(--rose-bg);color:var(--rose)}
.srow{width:100%;max-width:40rem;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.srow p{margin:0 0 8px;line-height:1.4}
.sline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.25rem;font-weight:700}
.sg{font:700 1.15rem var(--f-ui);min-width:2.4em;height:2em;border-radius:8px;border:2px solid var(--line);background:var(--paper);cursor:pointer;color:var(--ink)}
.sg:hover{border-color:var(--blue-b);background:var(--blue-bg)}
.sg.right{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.sg.wrong{opacity:.4;text-decoration:line-through;cursor:default}
.sg:disabled:not(.right):not(.wrong){opacity:.35}
.next{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:1.05rem;font-weight:700;cursor:pointer}
.next:hover{background:#1e293b}
.big-ok{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;animation:bo-out 1.2s ease forwards}
.big-ok svg{width:min(30vw,30vh,200px);height:auto;animation:bo-pop .4s cubic-bezier(.2,1.5,.4,1)}
.bo-c{fill:var(--green)}
.bo-k{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:bo-draw .35s .12s ease-out forwards}
@keyframes bo-pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes bo-draw{to{stroke-dashoffset:0}}
@keyframes bo-out{0%,70%{opacity:1}100%{opacity:0}}
/* turn in: the student code goes to the Google Form */
.ti-modal{position:fixed;inset:0;z-index:150;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px}
.ti-card{background:var(--paper);border:2px solid var(--green-b);border-radius:16px;padding:22px 26px;width:100%;max-width:560px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.ti-card h2{margin:0;font-size:1.9rem;color:var(--green)}
.ti-sub{margin:0;font-size:1.1rem;color:var(--text)}
.ti-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.ti-q{display:inline-flex;align-items:center;justify-content:center;height:2rem;border-radius:8px;border:1.5px solid #cbd5e1;background:var(--paper);color:var(--faint);font-weight:700;font-size:.9rem}
.ti-q.done{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.ti-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--muted)}
.ti-legend>span{display:inline-flex;align-items:center;gap:6px}
.ti-legend .ti-q{width:1.3rem;height:1.3rem;font-size:.7rem}
#tiForm{display:flex;flex-direction:column;gap:8px}
#tiForm label{font-weight:700;color:var(--ink)}
.ti-warn{background:var(--green-bg);border-radius:10px;padding:8px 12px;font-size:.95rem;color:var(--text)}
#tiCode{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;max-width:260px;padding:9px 12px;border:1.5px solid #cbd5e1;border-radius:10px}
#tiCode:focus{outline:2px solid var(--green-b);outline-offset:1px}
.ti-submit{align-self:flex-start}
.ti-feedback{margin:0;font-size:1.05rem;color:var(--text)}
.ti-feedback:empty{display:none}
.ti-feedback .ok{color:var(--green);font-size:1.4rem;font-weight:800}
@media (max-width:520px){.ti-grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:860px){
  .main{overflow-y:auto}
  .stage{flex-shrink:0;height:86vh}
  .qbar{flex-direction:column;gap:8px;padding:10px 12px}
  .qcard{width:100%}
  .status{flex:none;width:100%}
  .qcard{flex-direction:column;gap:6px}
  .qhead{flex-direction:row;gap:10px;border-right:0;padding-right:0}
}
@media (prefers-reduced-motion:reduce){ .big-ok svg{animation:none} .bo-k{animation:none;stroke-dashoffset:0} }
</style>
</head><body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-t">Equations Study Guide #1</span></div>
    <div class="top-r">
      <span class="score" id="score"></span>
      <button class="btn" id="origBtn" type="button" title="Back to the numbers on the study guide" hidden>Study guide numbers</button>
      <button class="btn" id="newBtn" type="button" title="Same kind of question, new numbers">New numbers</button>
    </div>
  </header>
  <nav class="strip" id="strip" aria-label="Questions"></nav>
  <main class="main" id="main">
    <section class="stage" aria-label="Work it out">
      <div class="qbar">
        <div class="qcard" id="qcard"></div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <div class="stagebody">
        <div id="frames"></div>
        <div class="hpanel" id="hpanel" hidden></div>
      </div>
    </section>
  </main>
</div>

<script>
const ENG={"solve": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Solving drill\u003c/title>\n\u003cstyle>\n/* Same look as the Clearing Decimals & Fractions drill: header bar, question strip, the question and its\n   picture on the side, the work in the middle, the prompt under the question. */\n:root{\n  --ink:#0f172a; --line:#1e293b; --muted:#64748b; --faint:#94a3b8; --prompt:#334155; --slate:#475569;\n  --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff;\n  --green:#059669; --green-b:#10b981; --green-bg:#ecfdf5;\n  --rose:#e11d48; --rose-b:#fb7185; --rose-bg:#fff1f2;\n  --ui:#047857; --ui-b:#10b981; --ui-bg:#ecfdf5; --ui-edge:#a7f3d0;\n  --page:#f8fafc; --edge:#e2e8f0; --white:#ffffff;\n  --hl:#fef08a; --hl-edge:#facc15;\n  color-scheme:light;\n}\n*{box-sizing:border-box;}\nhtml,body{height:100%;margin:0;}\nhtml{font-size:clamp(16px,1.15vw + .6vh,26px);}\nbody{background:var(--page);color:var(--ink);font-family:Tahoma,Verdana,Geneva,sans-serif;-webkit-font-smoothing:antialiased;}\nbutton,input{font-family:Tahoma,Verdana,Geneva,sans-serif;}\n.app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:12px;\n  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}\n.wrap{width:100%;max-width:120rem;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}\n\n/* header */\n.drillhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;\n  flex-shrink:0;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--edge);}\n.dh-name{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}\n.dh-right{display:inline-flex;align-items:center;gap:12px;}\n.dh-count{font-size:1rem;font-weight:700;color:var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap;}\n.turnin-link{font-weight:700;font-size:.75rem;padding:4px 12px;border-radius:8px;cursor:pointer;\n  background:var(--white);color:var(--ui);border:2px solid var(--ui-edge);}\n.turnin-link:hover{border-color:var(--ui-b);background:var(--ui-bg);}\n\n/* question strip */\n.qstrip{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;flex-shrink:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px;}\n.qstrip .qlab{flex-shrink:0;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 3px 0 6px;white-space:nowrap;}\n.qstrip .qlab:first-child{margin-left:0;}\n.qn{flex:1 0 auto;min-width:1.45em;height:1.4rem;padding:0 2px;border-radius:6px;border:1.5px solid var(--edge);background:var(--white);color:var(--muted);\n  font-size:.66rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;}\n.qn:hover{border-color:var(--ui-b);color:var(--ui);}\n.qn:focus-visible{outline:3px solid var(--ui-b);outline-offset:2px;}\n.qn.done{color:var(--green);border-color:#a7f3d0;background:var(--green-bg);}\n.qn.on{background:var(--ui);border-color:var(--ui);color:var(--white);}\n\n/* side: the question, its picture, the prompt */\n.main{flex:1;min-height:0;display:flex;gap:28px;margin-top:10px;}\n.side{flex:0 0 clamp(18rem,34%,34rem);display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-bottom:6px;}\n.story{flex-shrink:0;padding:10px 14px;border-left:4px solid var(--ui-b);background:var(--ui-bg);\n  border-radius:0 10px 10px 0;font-size:1.05rem;line-height:1.5;color:var(--prompt);}\n.story-lab{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ui);margin-bottom:2px;}\n.story-txt{display:block;}\n.story .model{display:block;text-align:center;margin-top:6px;font-weight:700;color:var(--ink);font-size:1.25rem;}\n.story .stack{font-size:.85em;}\n.memes{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px;}\n.memes f 1.5rem;}\n.panel:empty{display:none;}\n.qimg{display:block;width:auto;max-width:min(46rem,100%);max-height:52vh;height:auto;border:1px solid var(--edge);border-radius:8px;background:#fff;}\n.qimg.narrow{max-width:min(30rem,100%);}\n.choices{display:flex;flex-direction:column;gap:6px;font-size:1.6rem;}\n.choices div b{display:inline-block;width:1.6em;color:var(--slate);}\n.pick{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;padding:10px 18px;border:2px solid var(--ui-b);background:var(--ui-bg);border-radius:12px;}\n.pick .box{height:2.6rem;width:6rem;font-size:1.4rem;}\n.pick .lbl{font-weight:700;color:var(--slate);font-size:1.1rem;}\n.fill{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:12px 20px;border:2px solid var(--ui-b);background:var(--ui-bg);border-radius:12px;font-size:1.45rem;line-height:1.5;max-width:52rem;}\n.fill .box{height:2.4rem;width:6.4rem;font-size:1.3rem;}\n.fill .box.w-sign{width:3.4rem;}\n.fill select.box{width:auto;min-width:6.4rem;padding:0 .3em;text-align:left;cursor:pointer;font-family:inherit;}\n.fill .gv{font-weight:700;color:var(--green);}\n.parts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-size:1.15rem;}\n.parts span{padding:3px 12px;border-radius:999px;background:var(--green-bg);color:var(--green);border:1.5px solid #a7f3d0;font-weight:700;}\n.checkline{text-align:center;font-size:1.9rem;line-height:2.1;}\n.checkline .cl-lab{font-size:.95rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);line-height:1.4;margin-bottom:4px;}\n.checkline .cl-note{font-size:1rem;color:var(--muted);line-height:1.4;margin-top:6px;}\n.ck{opacity:0;transform:translateY(-6px);transition:opacity .4s ease,transform .4s ease;}\n.ck.in{opacity:1;transform:none;}\n.ck .tick{color:var(--green);font-weight:700;}\n.finale{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:1.4rem;color:var(--green);font-weight:700;text-align:center;}\n.finale img{width:min(22rem,100%);border-radius:10px;}\n\n@media (max-width:900px){\n  .main{flex-direction:column;gap:0;margin-top:0;}\n  .side{display:contents;}\n  .story{order:0;margin-top:10px;}\n  .memes img{max-height:200px;}\n  .main .work{order:1;}\n  .promptbar{order:2;border-left:none;border-top:1px solid var(--edge);padding:12px 0 4px;}\n  .row-between{flex-direction:row;align-items:center;justify-content:space-between;}\n}\n@media (max-width:640px){\n  .eq{font-size:1.6rem;column-gap:14px;}\n  .prompt,.hint1,.missline{font-size:1.02rem;}\n  .panel{font-size:1.1rem;}\n  .checkline{font-size:1.2rem;}\n  .choices{font-size:1.15rem;}\n  .fill{font-size:1.05rem;}\n  .story{font-size:.92rem;padding:8px 10px;}\n  .row-between{flex-wrap:wrap;}\n}\n@media (prefers-reduced-motion:reduce){ .fresh,.ansbox.now{animation:none;} .ck{transition:none;} }\n/* inside the Extra Credit page: the page shows the question, its number and the score */\n.drillhead,.qstrip,#story{display:none!important}\n.choices div{display:flex;align-items:center;gap:8px;}\n.choices svg{display:block;width:min(30rem,64vw);height:auto;}\n/* clearing: the number typed in the first box, filled in for every other term */\n.gone,.gone .pr{color:var(--faint);}\n.clrmir{display:inline-block;min-width:1.4em;height:1.15em;line-height:1.15;vertical-align:middle;text-align:center;font-size:.6em;color:var(--ui);border-bottom:3px dashed var(--ui-b);margin-right:.1em;}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"drillhead\">\n      \u003cspan class=\"dh-name\">Solving Inequalities &middot; Australian Edition\u003c/span>\n      \u003cspan class=\"dh-right\">\u003cspan class=\"dh-count\" id=\"qlabel\">\u003c/span>\u003cbutton class=\"turnin-link cross-btn\" id=\"crossBtn\" type=\"button\">Cross-simplify help: On\u003c/button>\u003cbutton class=\"turnin-link\" id=\"randBtn\" type=\"button\">Give me one\u003c/button>\u003cbutton class=\"turnin-link ti-head\" id=\"turninBtn\" type=\"button\">Turn in\u003c/button>\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"qstrip\" id=\"qstrip\">\u003c/div>\n    \u003cdiv class=\"main\">\n      \u003caside class=\"side\">\n        \u003cdiv class=\"story\" id=\"story\">\u003c/div>\n        \u003cdiv class=\"promptbar\" id=\"promptbar\" aria-live=\"polite\">\u003c/div>\n      \u003c/aside>\n      \u003cdiv class=\"work\" id=\"work\">\n        \u003cdiv class=\"fitbox\" id=\"fitbox\">\n          \u003cdiv class=\"stagelab\" id=\"stagelab\" hidden>\u003c/div>\n          \u003cdiv class=\"eq\" id=\"eq\">\u003c/div>\n          \u003cdiv class=\"panel\" id=\"panel\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>/*SPEC*/\u003c/script>\n\u003cscript>\nconst IMG = {};\nconst SPEC = window.HOST_SPEC || {};\n/* tell the Extra Credit page what happened: done (the question is solved), next (the student pressed Next) */\nfunction POST(m){ try{ parent.postMessage(Object.assign({drill:1}, m), \"*\"); }catch(e){} }\n/* an equation (=) rather than an inequality */\nfunction isEq(){ return typeof CUR!==\"undefined\" && !!CUR && CUR.s===\"=\"; }\n\n/* ================= numbers ================= */\nconst M=\"−\";\nfunction gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }\nfunction R(n,d){ if(d===undefined) d=1; if(d\u003c0){ n=-n; d=-d; } const g=gcd(n,d); return {n:n/g, d:d/g}; }\nfunction neg(a){ return {n:-a.n, d:a.d}; }\nfunction addR(a,b){ return R(a.n*b.d + b.n*a.d, a.d*b.d); }\nfunction mulR(a,b){ return R(a.n*b.n, a.d*b.d); }\nfunction divR(a,b){ return R(a.n*b.d, a.d*b.n); }\nfunction same(a,b){ return !!a && !!b && a.n*b.d === b.n*a.d; }\nfunction numR(s){\n  if(s.indexOf(\".\")>=0){ const p=s.split(\".\"); const d=Math.pow(10,p[1].length); return R((+p[0]||0)*d + (+p[1]||0), d); }\n  return R(+s);\n}\nfunction termR(s){ if(s.indexOf(\"/\")>=0){ const p=s.split(\"/\"); return +p[1] ? R(+p[0], +p[1]) : null; } return numR(s); }\nfunction stripParens(s){ while(/^\\([^()]*\\)$/.test(s)) s=s.slice(1,-1); return s; }\nconst NUM=\"(\\\\d+(?:\\\\.\\\\d*)?|\\\\.\\\\d+)\";\n/* what a student types: 7, -3, 2.5, 7/2, 3 1/2 */\nfunction parseVal(raw){\n  let s=String(raw==null?\"\":raw).trim().replace(/[−–—]/g,\"-\").replace(/\\s+/g,\" \").replace(/(\\d),(?=\\d{3}(?!\\d))/g,\"$1\");\n  s=stripParens(s).trim(); let m;\n  if((m=s.match(/^([+-]?)\\s*(\\d+) (\\d+)\\/(\\d+)$/))){ if(!+m[4]) return null; const r=R(+m[2]*+m[4]+ +m[3], +m[4]); return m[1]===\"-\"?neg(r):r; }\n  s=s.replace(/\\s/g,\"\");\n  if((m=s.match(/^([+-]?)(\\d+)\\/(\\d+)$/))){ if(!+m[3]) return null; return R((m[1]===\"-\"?-1:1)*+m[2], +m[3]); }\n  if((m=s.match(new RegExp(\"^([+-]?)\"+NUM+\"$\")))){ const r=numR(m[2]); return m[1]===\"-\"?neg(r):r; }\n  return null;\n}\n/* a letter term: 3x, -x, 9/2x, (9/2)x, x/6, 3x/4 */\nfunction parseTerm(raw){\n  let s=String(raw==null?\"\":raw).trim().replace(/[−–—]/g,\"-\").replace(/\\s+/g,\"\").replace(/^\\+/,\"\");\n  let sg=1; if(s[0]===\"-\"){ sg=-1; s=s.slice(1); }\n  let m, c=null, L=null;\n  if((m=s.match(/^([a-zA-Z])$/))){ c=R(1); L=m[1]; }\n  else if((m=s.match(/^(\\d*)([a-zA-Z])\\/(\\d+)$/))){ if(!+m[3]) return null; c=R(m[1]===\"\"?1:+m[1], +m[3]); L=m[2]; }\n  else if((m=s.match(/^\\(?(\\d+\\/\\d+|\\d+(?:\\.\\d*)?|\\.\\d+)\\)?\\*?([a-zA-Z])$/))){ c=termR(m[1]); L=m[2]; }\n  if(!c) return null;\n  return {c: sg\u003c0?neg(c):c, L:L.toLowerCase()};\n}\nfunction normSign(raw){\n  const s=String(raw==null?\"\":raw).replace(/\\s+/g,\"\").replace(\"≤\",\"\u003c=\").replace(\"≥\",\">=\").replace(\"=\u003c\",\"\u003c=\").replace(\"=>\",\">=\");\n  return [\"\u003c\",\">\",\"\u003c=\",\">=\",\"=\"].indexOf(s)>=0 ? s : null;\n}\nconst SYM={\"\u003c\":\"&lt;\", \">\":\"&gt;\", \"\u003c=\":\"≤\", \">=\":\"≥\", \"=\":\"=\"};\nconst FLIP={\"\u003c\":\">\", \">\":\"\u003c\", \"\u003c=\":\">=\", \">=\":\"\u003c=\", \"=\":\"=\"};\n\n/* ================= written pieces ================= */\nfunction F(t,b){ return '\u003cspan class=\"stack\">\u003cspan class=\"t\">'+t+'\u003c/span>\u003cspan class=\"bar\">\u003c/span>\u003cspan class=\"b\">'+b+'\u003c/span>\u003c/span>'; }\nfunction MX(w,n,d){ return '\u003cspan class=\"mix\">'+w+F(n,d)+'\u003c/span>'; }\n/* a number as written: −9, 7/3 stacked, 2 1/4 as a mixed number */\nfunction numHTML(str){\n  let s=String(str).trim().replace(/[−–—]/g,\"-\"), sg=\"\";\n  if(s[0]===\"-\"){ sg=M; s=s.slice(1).trim(); } else if(s[0]===\"+\"){ s=s.slice(1).trim(); }\n  let m;\n  if((m=s.match(/^(\\d+) (\\d+)\\/(\\d+)$/))) return sg+MX(m[1],m[2],m[3]);\n  if((m=s.match(/^(\\d+)\\/(\\d+)$/))) return sg+F(m[1],m[2]);\n  return sg+s;\n}\nfunction termHTML(str){\n  let s=String(str).trim().replace(/[−–—]/g,\"-\").replace(/\\s+/g,\"\"), sg=\"\";\n  if(s[0]===\"-\"){ sg=M; s=s.slice(1); } else if(s[0]===\"+\") s=s.slice(1);\n  let m;\n  if((m=s.match(/^(\\d*)([a-zA-Z])\\/(\\d+)$/))) return sg+F((m[1]===\"1\"?\"\":m[1])+m[2], m[3]);\n  if((m=s.match(/^(\\d+)\\/(\\d+)([a-zA-Z])$/))) return sg+F(m[1],m[2])+m[3];\n  if((m=s.match(/^(\\d*(?:\\.\\d+)?)([a-zA-Z])$/))) return sg+(m[1]===\"1\"?\"\":m[1])+m[2];\n  return sg+s;\n}\nfunction isNegStr(w){ return /^\\s*[-−]/.test(String(w)); }\nfunction absStr(w){ return String(w).trim().replace(/^[-−+]\\s*/,\"\"); }\n\n/* ================= moves done to both sides ================= */\nfunction moveOf(raw){\n  let s=String(raw==null?\"\":raw).trim().replace(/[−–—]/g,\"-\").toLowerCase()\n    .replace(/^(add|plus)\\s*/,\"+\").replace(/^(subtract|minus)\\s*/,\"-\")\n    .replace(/^(multiply by|multiply|times)\\s*/,\"*\").replace(/^(divide by|divide)\\s*/,\"/\");\n  if(!s) return null;\n  let op=s[0], rest=s.slice(1).trim();\n  if(op===\"×\"||op===\"·\"||(op===\"x\" && /^[\\d(.\\-+]/.test(rest))) op=\"*\";\n  if(op===\"÷\") op=\"/\";\n  if(\"+-*/\".indexOf(op)\u003c0) return null;\n  rest=rest.replace(/^\\((.*)\\)$/,\"$1\").trim();\n  let v=parseVal(rest), L=null;\n  if(!v){ const t=parseTerm(rest); if(!t) return null; v=t.c; L=t.L; }\n  if(op===\"+\") return {k:\"add\", v:v, L:L};\n  if(op===\"-\") return {k:\"add\", v:neg(v), L:L};\n  if(L) return null;\n  if(!v.n) return {k:\"zero\"};\n  return op===\"*\" ? {k:\"mul\", v:v, div:false} : {k:\"mul\", v:divR(R(1),v), div:true};\n}\nfunction sameMove(a,b){\n  if(!a||!b||a.k!==b.k) return false;\n  if(a.k===\"add\") return a.L===b.L && same(a.v,b.v);\n  return same(a.v,b.v);\n}\nfunction moveHTML(w){\n  const s=String(w).trim(), op=s[0], rest=s.slice(1).trim().replace(/^\\((.*)\\)$/,\"$1\");\n  const body=/[a-z]/i.test(rest) ? termHTML(rest) : numHTML(rest);\n  if(op===\"+\"||op===\"-\") return (op===\"-\"?M:\"+\")+\" \"+body;\n  return (op===\"*\"?\"×\":\"÷\")+\" \"+(isNegStr(rest)?\"(\"+body+\")\":body);\n}\nfunction negMove(st){ if(!st || st.k!==\"do\" || isEq()) return null; const m=moveOf(st.w[0]); return (m && m.k===\"mul\" && m.v.n\u003c0) ? (m.div?\"divided\":\"multiplied\") : null; }\n\n/* ================= the answer, typed the quiz's way ================= */\nfunction parseIneq(raw){\n  const s=String(raw==null?\"\":raw).trim().replace(/[−–—]/g,\"-\").replace(/≤/g,\"\u003c=\").replace(/≥/g,\">=\").replace(/=\u003c/g,\"\u003c=\").replace(/=>/g,\">=\");\n  let m=s.match(/^([a-zA-Z])\\s*(\u003c=|>=|\u003c|>|=)\\s*(.+)$/);\n  if(m){ const v=parseVal(m[3]); return v ? {L:m[1], op:m[2], v:v, raw:m[3].trim(), rev:false} : null; }\n  m=s.match(/^(.+?)\\s*(\u003c=|>=|\u003c|>|=)\\s*([a-zA-Z])$/);\n  if(m){ const v=parseVal(m[1]); return v ? {L:m[3], op:FLIP[m[2]], v:v, raw:m[1].trim(), rev:true} : null; }\n  return null;\n}\nfunction unreduced(raw){\n  const s=String(raw).replace(/[−–—-]/g,\"\"); let m;\n  if((m=s.match(/(\\d+) (\\d+)\\/(\\d+)/))) return gcd(+m[2],+m[3])>1 || +m[2]>=+m[3];\n  if((m=s.match(/(\\d+)\\/(\\d+)/))) return gcd(+m[1],+m[2])>1 || +m[2]===1;\n  return false;\n}\n/* mixed numbers: an improper answer gets written as a mixed number */\n/* a mixed number in front of a letter, like −4 1/2x: hand back the mixed number part */\nfunction mixedCoef(x){ const m=String(x).replace(/[−–—]/g,\"-\").match(/([+-]?)\\s*\\(?\\s*(\\d+)\\s+(\\d+)\\s*\\/\\s*(\\d+)\\s*\\)?\\s*\\*?\\s*[a-zA-Z]/); return m ? (m[1]===\"-\"?\"-\":\"\")+m[2]+\" \"+m[3]+\"/\"+m[4] : null; }\nfunction mixedCoefNote(mc){ return \"Don't put a mixed number in front of a letter. Write \"+numHTML(mc)+\" as an \u003cstrong>improper fraction\u003c/strong> or a \u003cstrong>decimal\u003c/strong>.\"; }\nfunction isMixedStr(x){ return /^\\s*[-−]?\\s*\\d+\\s+\\d+\\s*\\/\\s*\\d+\\s*$/.test(String(x)); }\nfunction improperStr(raw){ const m=String(raw).replace(/[−–—]/g,\"-\").trim().match(/^(-?)(\\d+)\\/(\\d+)$/); return m && +m[3]>1 && +m[2]>+m[3] ? m : null; }\nfunction toMixed(raw){ const m=improperStr(raw); if(!m) return raw; const n=+m[2], d=+m[3]; return m[1]+Math.floor(n/d)+\" \"+(n%d)+\"/\"+d; }\nconst MIXNOTE=\"Right number! Now write it as a \u003cstrong>mixed number\u003c/strong>: the whole number, one space, then the fraction, like 2 1/4.\";\nfunction ansHTML(w,flip){\n  const p=parseIneq(w), sg=SYM[p.op];\n  return p.L+\" \"+(flip?'\u003cspan class=\"flipsg\">'+sg+'\u003c/span>':sg)+\" \"+numHTML(p.raw);\n}\n\n/* ================= checking one box ================= */\n/* the mistakes these notes go after: doing a step to only one side, and adding or subtracting\n   the number that's multiplying the letter instead of multiplying by its reciprocal */\nconst ONE_SIDE_ROW=\"That's what this side was \u003cstrong>before\u003c/strong> the last step. Did you do the step to only \u003cstrong>one side\u003c/strong>? Whatever you do to one side, you do to the \u003cstrong>other side\u003c/strong> too.\";\nconst ONE_SIDE_DO=\"You did it to one side. Now do the \u003cstrong>same thing\u003c/strong> to the \u003cstrong>other side\u003c/strong>. Whatever you do to one side, you do to the other.\";\nconst BOTH_SIDES=\"Your two sides don't match. Whatever you do to one side, you do the \u003cstrong>exact same thing\u003c/strong> to the \u003cstrong>other side\u003c/strong>.\";\nfunction undoMove(mv,w){ if(mv.k===\"add\") return mv.L ? null : addR(w,neg(mv.v)); if(mv.k===\"mul\") return divR(w,mv.v); return null; }\nfunction coefAddNote(c){\n  return \"Look at the letter: it's being \u003cstrong>multiplied\u003c/strong> by \"+rHTML(c)+\". Adding or subtracting can't undo multiplying, so the letter would never end up by itself. Do the opposite of multiplying: \"\n    +(c.d>1 ? \"\u003cstrong>multiply both sides by the reciprocal\u003c/strong> (flip the fraction over).\" : \"\u003cstrong>divide both sides\u003c/strong> by \"+rHTML(c)+\".\")+\" Press \u003cstrong>Undo\u003c/strong> to start the move over.\";\n}\nfunction coefAgainNote(c){\n  return \"That multiplies by \"+rHTML(c)+\" \u003cstrong>again\u003c/strong>, so the letter still isn't by itself. Do the opposite: \"\n    +(c.d>1 ? \"multiply by the \u003cstrong>reciprocal\u003c/strong> (flip the fraction over).\" : \"divide by \"+rHTML(c)+\".\")+\" Press \u003cstrong>Undo\u003c/strong> to start the move over.\";\n}\nfunction judgeBox(b,raw,ctx){\n  const s=String(raw==null?\"\":raw).trim();\n  if((b.t===\"num\"||b.t===\"term\") && b.j && !/^\\s*[+\\-−–—]/.test(s)) return {ok:false,note:\"Type the sign first: \u003cstrong>+\u003c/strong> or \u003cstrong>\"+M+\"\u003c/strong> (\u003cstrong>A\u003c/strong> or \u003cstrong>S\u003c/strong>).\"};\n  if(b.t===\"num\"){\n    const v=parseVal(s);\n    if(!v){ if(parseTerm(s)) return {ok:false,note:\"This one is a plain number, no letter.\"}; return {ok:false,note:\"Type a number, like −9, 25 or 7/3.\"}; }\n    const w=parseVal(b.w);\n    if(!same(v,w) && w.n && same(v,neg(w))) return {ok:false,note:\"Check the sign.\"};\n    if(!same(v,w)){\n      const u=ctx && ctx.mv ? undoMove(ctx.mv,w) : null;\n      if(u && !same(u,w) && same(v,u)) return {ok:false,note:ONE_SIDE_ROW};\n      return {ok:false};\n    }\n    if(b.quiz && isMixedStr(b.w) && !isMixedStr(s)) return {ok:false,note:MIXNOTE};\n    if(b.quiz && !ctx.dec && /\\./.test(s)) return {ok:false,note:\"Right number, but the quiz says no decimals. Write it as a fraction or a mixed number.\"};\n    if(b.quiz && unreduced(s)) return {ok:false,note:\"Simplify the fraction.\"};\n    return {ok:true};\n  }\n  if(b.t===\"term\"){\n    if(mixedCoef(s)) return {ok:false,note:mixedCoefNote(mixedCoef(s))};\n    const t=parseTerm(s), w=parseTerm(b.w);\n    if(!t){ if(parseVal(s)) return {ok:false,note:\"This term has the letter in it. Type it like 3x.\"}; return {ok:false,note:\"Type the term, like 3x or −9/2x.\"}; }\n    if(t.L!==w.L) return {ok:false,note:\"Use the letter \"+w.L+\".\"};\n    if(same(t.c,neg(w.c)) && t.c.n) return {ok:false,note:\"Check the sign.\"};\n    if(!same(t.c,w.c) && ctx && ctx.mv && ctx.mv.k===\"mul\"){\n      const u=divR(w.c,ctx.mv.v);\n      if(!same(u,w.c) && same(t.c,u)) return {ok:false,note:ONE_SIDE_ROW};\n    }\n    return {ok:same(t.c,w.c)};\n  }\n  if(b.t===\"sign\"){\n    const g=normSign(s); if(!g) return {ok:false,note:\"Type one of &lt;  &gt;  &lt;=  &gt;=\"};\n    if(g===b.w) return {ok:true};\n    if(g===FLIP[b.w]) return {ok:false,note: ctx.flip ? \"You \"+ctx.flip+\" by a negative, so the sign flips.\" : \"Check the direction of the sign.\"};\n    return {ok:false,note:\"Check if the line under the sign belongs there: &lt; or ≤?\"};\n  }\n  if(b.t===\"do\"){\n    if(mixedCoef(s)) return {ok:false,note:mixedCoefNote(mixedCoef(s).replace(/^-/,\"\"))};\n    const g=moveOf(s), want=moveOf(b.w[0]);\n    if(!g) return {ok:false,note:\"Type the operation and the number together, like −9, +2, ×8 or /3.\"};\n    if(g.k===\"mul\" && g.div && want.k===\"mul\"){\n      const dv=divR(R(1),g.v);\n      if(dv.d!==1 && b.w.some(function(x){ return sameMove(g,moveOf(x)); }))\n        return {ok:false, recip:true, note:\"Dividing by \"+rHTML(dv)+\" works, but multiplying by the \u003cstrong>reciprocal\u003c/strong> is faster. Multiply both sides by \"+rHTML(g.v)+\" instead.\"};\n    }\n    if(g.k===\"add\" && want.k===\"mul\" && b.fast && b.fast.some(function(x){ const v=parseVal(x); return v && same(v,g.v); }))\n      return {ok:false, note:(g.v.n\u003c0?\"Subtracting \":\"Adding \")+rHTML(g.v.n\u003c0?neg(g.v):g.v)+\" works, but there's a \u003cstrong>faster\u003c/strong> way: multiply both sides by the \u003cstrong>LCM of the denominators\u003c/strong>. That clears every fraction in one move.\"};\n    if(g.k===\"add\" && want.k===\"mul\" && b.coef) return {ok:false,note:coefAddNote(parseVal(b.coef))};\n    if(b.w.some(function(x){ return sameMove(g,moveOf(x)); })) return {ok:true};\n    if(b.clr) return {ok:false,note:b.clr+\" Press \u003cstrong>Undo\u003c/strong> to start the move over.\"};\n    if(g.k===\"mul\" && b.coef && same(g.v,parseVal(b.coef))) return {ok:false,note:coefAgainNote(parseVal(b.coef))};\n    if(g.k!==want.k) return {ok:false,note:(want.k===\"add\" ? \"Something is being added or subtracted here. Get rid of it first with + or \"+M+\".\" : \"Now it's multiplying (or dividing). Get rid of it with × or ÷.\")\n      +\" Press \u003cstrong>Undo\u003c/strong> to start the move over.\"};\n    if(g.k===\"add\" && same(g.v,neg(want.v))) return {ok:false,note:\"That adds more of the same. Do the \u003cstrong>opposite\u003c/strong> of what's there: + undoes \"+M+\", and \"+M+\" undoes +.\"};\n    if(g.k===\"mul\" && same(g.v,divR(R(1),want.v))) return {ok:false,note:\"That's the same thing again, not the opposite. Flip the operation.\"};\n    if(g.k===\"mul\" && same(g.v,neg(want.v))) return {ok:false,note:\"Keep the sign of the number with the letter. If it's negative, use a negative.\"};\n    return {ok:false};\n  }\n  if(b.t===\"do2\"){\n    /* the box under the other side: the same move as the first box */\n    const g=moveOf(s);\n    if(!g) return {ok:false,note:\"Type the move on this side too, like +9, \"+M+\"9, ×3 or /3.\"};\n    const d=moveOf(ctx && ctx.dval || \"\");\n    if(!d || !sameMove(g,d)) return {ok:false,note:BOTH_SIDES};\n    return {ok: !!(ctx && ctx.dbox) && judgeBox(ctx.dbox,ctx.dval,ctx).ok};\n  }\n  if(b.t===\"ans\"){\n    const want=parseIneq(b.w), got=parseIneq(s);\n    if(!got){\n      if(parseVal(s)) return {ok:false,note:\"Just a number gets marked wrong on the quiz. Type the whole answer, like \"+want.L+\"&lt;4.\"};\n      return {ok:false,note:\"Type it like \"+want.L+\"&lt;4 or \"+want.L+\"&gt;=2/3.\"};\n    }\n    if(got.L.toLowerCase()!==want.L.toLowerCase()) return {ok:false,note:\"Use the letter \"+want.L+\".\"};\n    const vOK=same(got.v,want.v);\n    if(got.rev && vOK && got.op===want.op) return {ok:false,note:\"Same answer, but the quiz wants the letter \u003cstrong>first\u003c/strong>. Read it from the \"+want.L+\" side and turn it around.\"};\n    if(vOK && got.op!==want.op && (want.op===\"=\" || got.op===\"=\"))\n      return {ok:false,note: want.op===\"=\" ? \"This is an equation, so the answer uses =.\" : \"This is an inequality, so the answer uses &lt;, &gt;, ≤ or ≥.\"};\n    if(vOK && got.op!==want.op){\n      if(got.op===FLIP[want.op]) return {ok:false,note: ctx.flip ? \"You \"+ctx.flip+\" by a negative, so flip the sign.\" : \"The sign points the wrong way.\"};\n      return {ok:false,note:\"Close. Check &lt; versus ≤ (or &gt; versus ≥).\"};\n    }\n    if(!vOK) return {ok:false};\n    if(isMixedStr(want.raw) && !isMixedStr(got.raw)) return {ok:false,note:MIXNOTE};\n    if(!ctx.dec && /\\./.test(got.raw)) return {ok:false,note:\"Right number, but the quiz says no decimals. Write it as a fraction or a mixed number.\"};\n    if(unreduced(got.raw)) return {ok:false,note:\"Simplify the fraction.\"};\n    if(got.rev) return {ok:false,note:\"Put the letter first.\"};\n    if(/\\s/.test(s.replace(/\\d\\s+\\d+\\s*\\/\\s*\\d+/,\"\"))) return {ok:false,note:\"Right! But the quiz says \u003cstrong>no spaces\u003c/strong> (only inside a mixed number). Take them out.\"};\n    return {ok:true};\n  }\n  if(b.t===\"let\"){\n    const g=(s.toUpperCase().match(/[A-F]/g)||[]).filter(function(c,i,a){ return a.indexOf(c)===i; }).sort().join(\"\");\n    if(!g) return {ok:false,note:\"Type the letter.\"};\n    if(g===b.w) return {ok:true};\n    if(b.w.length>1 && g.length\u003cb.w.length && b.w.indexOf(g)>=0) return {ok:false,note:\"Those are right, but there are more. Type every letter that works.\"};\n    if(b.w.length===1 && g.length>1) return {ok:false,note:\"Just one letter.\"};\n    return {ok:false};\n  }\n  if(b.t===\"clr\"){\n    const v=parseVal(s.replace(/^[×*·xX]\\s*/,\"\"));\n    if(!v) return {ok:false,note:\"Type the number to multiply by in each box, like 10.\"};\n    if(b.side && !same(v,parseVal(b.w)) && ctx && ctx.c0){ const c0=parseVal(String(ctx.c0).replace(/^[×*·xX]\\s*/,\"\")); if(c0 && !same(c0,v)) return {ok:false,note:BOTH_SIDES}; }\n    return same(v,parseVal(b.w)) ? {ok:true} : {ok:false,note:b.how+\" Put it in front of \u003cstrong>every\u003c/strong> term.\"};\n  }\n  if(b.t===\"word\") return {ok: b.w.indexOf(s.toLowerCase().replace(/\\s+/g,\" \"))>=0};\n  return {ok:false};\n}\n/* how a box looks once it's right */\nfunction boxShow(b){\n  if(b.t===\"num\") return b.j ? (isNegStr(b.w)?M:\"+\")+\" \"+numHTML(absStr(b.w)) : numHTML(b.w);\n  if(b.t===\"term\") return b.j ? (isNegStr(b.w)?M:\"+\")+\" \"+termHTML(absStr(b.w)) : termHTML(b.w);\n  if(b.t===\"sign\") return SYM[b.w];\n  if(b.t===\"word\") return b.w[0];\n  return b.w;\n}\nfunction boxCls(b){\n  if(b.t===\"sign\") return \"w-sign\";\n  if(b.t===\"term\") return \"w-term\";\n  if(b.t===\"do\"||b.t===\"do2\") return \"w-do\";\n  if(b.t===\"ans\") return \"w-ans\";\n  return /[\\/.]/.test(b.w) ? \"w-frac\" : \"w-num\";\n}\n\n/* ================= the questions ================= */\nconst N=function(w,j){ return {t:\"num\", w:w, j:!!j}; };\nconst T=function(w,j){ return {t:\"term\", w:w, j:!!j}; };\nconst S=function(w){ return {t:\"sign\", w:w}; };\nconst W=function(){ return {t:\"word\", w:Array.prototype.slice.call(arguments)}; };\n/* a drop-down menu: the right choice, then every choice in the menu */\nconst PICK=function(right,opts){ return {t:\"word\", w:[right], sel:opts}; };\nconst SOLVE=\"Find the solution to the inequality.\";\n/* distributing: AS marks the number on the outside, AD each term it multiplies (same group number).\n   ⟨k|...⟩ marks a piece that lights up in the same color as the box it goes into */\nconst AS=function(g,t){ return '\u003cspan class=\"as\" data-g=\"'+g+'\">'+t+'\u003c/span>'; };\nconst AD=function(g,t){ return '\u003cspan class=\"ad\" data-g=\"'+g+'\">'+t+'\u003c/span>'; };\nconst QS=[SPEC.q || {l:\"\", L:\"x\", s:\"=\", R:\"0\", steps:[{k:\"copy\"}]}];\n/* each \"multiply or divide both sides\" step knows the number that's multiplying the letter,\n   so adding or subtracting that number gets its own note */\nfunction autoCoef(steps){\n  (steps||[]).forEach(function(st){\n    if(st.alt) st.alt.forEach(function(a){ autoCoef(a.steps); });\n    if(st.k!==\"do\" || st.coef) return;\n    let m=moveOf(st.w[0]);\n    if(st.ag){ if(!st.alt) return; m=moveOf(st.alt[0].w[0]); }\n    if(!m || m.k!==\"mul\") return;\n    st.coef=rStr(divR(R(1),m.v));\n  });\n}\nQS.forEach(function(q){ autoCoef(q.steps); });\n/* the check goes right after the answer */\nQS.forEach(prep);\n/* changing an improper answer to a mixed number: a box right next to the answer */\nfunction mixStep(raw){\n  const m=improperStr(raw), n=+m[2], d=+m[3], mix=toMixed(raw);\n  return {k:\"mix\", w:mix,\n    p:\"Now change \"+numHTML(raw)+\" to a \u003cstrong>mixed number\u003c/strong> and write it next to your answer. Type it with one space, like 2 1/4.\",\n    h:n+\" ÷ \"+d+\" = \"+Math.floor(n/d)+\" remainder \"+(n%d)+\", so \"+numHTML(raw)+\" = \"+numHTML(mix)+\".\"};\n}\nfunction mixPart(i){\n  const nx=CUR.steps[i+1];\n  if(!nx || nx.k!==\"mix\" || !(G.step>i || G.phase===\"end\")) return \"\";\n  const ask=G.step===i+1 && G.phase===\"ask\", wr=G.step===i+1 && G.phase===\"write\";\n  return ' \u003cspan class=\"mixeq\">or\u003c/span> '+(ask ? slotHTML(numHTML(nx.w), inputHTML(i+1,\"M\",{t:\"num\",w:nx.w,quiz:true},\"w3 c-num\"), null, \"write as a mixed number\") : '\u003cspan class=\"'+(wr?'blue fresh':'')+'\">'+numHTML(nx.w)+'\u003c/span>');\n}\nfunction letterRight(st){\n  if(!st || st.k!==\"row\") return false;\n  const r=plain(String(st.R)).trim(); if(/^[a-z]$/.test(r)) return true;\n  const m=r.match(/^\\{(\\w+)\\}$/); return !!m && st.b[m[1]] && st.b[m[1]].t===\"term\" && /^[a-z]$/.test(st.b[m[1]].w);\n}\nfunction prep(q){\n  /* the answer has the letter on the right: turn it around, and that line is the answer */\n  for(let i=q.steps.length-1;i>0;i--){\n    const a=q.steps[i]; if(a.k!==\"ans\" || !letterRight(q.steps[i-1])) continue;\n    const pa=parseIneq(a.w);\n    if(pa && improperStr(pa.raw)) q.steps.splice(i,1,{k:\"swap\", fin:a.w},mixStep(pa.raw));\n    else q.steps.splice(i,1,{k:\"swap\", fin:a.w});\n  }\n  for(let i=q.steps.length-1;i>=0;i--){\n    const st=q.steps[i]; if(st.k!==\"ans\" || (q.steps[i+1] && q.steps[i+1].k===\"mix\")) continue;\n    const pa=parseIneq(st.w), m=pa && improperStr(pa.raw); if(!m) continue;\n    q.steps.splice(i+1,0,mixStep(pa.raw));\n  }\n  if(q.cx && !q.steps.some(function(s){ return s.k===\"cross\"; })){\n    const di=q.steps.findIndex(function(s){ return s.k===\"clr\" || (s.k===\"do\" && String(s.w[0]).trim()[0]===\"*\"); });\n    if(di>=0){ const st=Object.assign({k:\"cross\"}, q.cx); crossSetup(st); if(st.items.length || st.autos) q.steps.splice(di+1,0,st); }\n  }\n  /* no \"check it\" step: it made the screen too busy */\n}\n\n/* ================= cross simplifying =================\n   Each term is a product: the number from \"multiply both sides\" (m) and the term (c), written m(c), or (c)m on\n   the right like the line above. A top number of one and a bottom number of the other that share a factor are a\n   pair: same color, a small box above the top number and below the bottom number for what's left after dividing. */\nfunction parseF(s){\n  if(typeof s===\"object\") return {neg:false, n:null, d:s.d, txt:s.t, v:\"\"};\n  let t=String(s).replace(/[−]/g,\"-\"), neg=false, m;\n  if(t[0]===\"-\"){ neg=true; t=t.slice(1); }\n  if((m=t.match(/^([a-z])$/))) return {neg:neg, n:1, d:1, v:m[1], bare:true};\n  if((m=t.match(/^(\\d*)([a-z])\\/(\\d+)$/))) return {neg:neg, n:m[1]===\"\"?1:+m[1], d:+m[3], vin:m[2], v:\"\"};\n  m=t.match(/^(\\d+)(?:\\/(\\d+))?([a-z]?)$/);\n  return {neg:neg, n:+m[1], d:m[2]?+m[2]:1, v:m[3]};\n}\nfunction crossSetup(st){\n  const items=[], map={}, said=[]; let pc=0, np=0;\n  [\"L\",\"R\"].forEach(function(S){ st[S].forEach(function(tm,ti){\n    const A=parseF(tm.m), B=parseF(tm.c); tm._A=A; tm._B=B;\n    const add=function(top,bot,whichT,whichB){\n      if(!top || !bot) return;\n      const g=gcd(top,bot); if(g\u003c2) return;\n      /* the same number on top and bottom just cancels: crossed out, nothing to type */\n      const pid=\"p\"+(np++);\n      if(top===bot){ map[S+\"|\"+ti+\"|\"+whichT+\"|n\"]={auto:true,pid:pid}; map[S+\"|\"+ti+\"|\"+whichB+\"|d\"]={auto:true,pid:pid}; st.autos=(st.autos||0)+1; return; }\n      const c=(pc++%6)+1;\n      [[whichT,\"n\",top],[whichB,\"d\",bot]].forEach(function(x){\n        const it={id:\"c\"+items.length, w:x[2]/g, c:c, pid:pid}; items.push(it); map[S+\"|\"+ti+\"|\"+x[0]+\"|\"+x[1]]=it;\n      });\n      const t=top+\" and \"+bot+\" both divide by \"+g+\".\"; if(said.indexOf(t)\u003c0) said.push(t);\n    };\n    if(A.n!=null && B.d>1) add(A.n,B.d,\"A\",\"B\");\n    if(B.n!=null && !B.bare && A.d>1) add(B.n,A.d,\"B\",\"A\");\n  }); });\n  st.items=items; st.map=map;\n  st.h=said.join(\" \")+\" Type what's left in each box.\";\n  /* every term either is a number times its reciprocal or has nothing to cancel */\n  const isRecip=function(tm){ const A=tm._A, B=tm._B; return B.txt==null && !B.bare && A.n===B.d && A.d===B.n; };\n  const noPair=function(tm){ const A=tm._A, B=tm._B;\n    return (B.d\u003c2 || gcd(A.n,B.d)\u003c2) && (B.txt!=null || B.bare || !B.n || A.d\u003c2 || gcd(B.n,A.d)\u003c2); };\n  const all=st.L.concat(st.R);\n  st.recip=all.some(isRecip) && all.every(function(tm){ return isRecip(tm) || noPair(tm); });\n}\nlet CROSS=true;\ntry{ CROSS=localStorage.getItem(\"crossHelp\")!==\"off\"; }catch(e){}\nfunction crossBtnText(){ return \"Cross-simplify help: \"+(CROSS?\"On\":\"Off\"); }\nfunction toggleCross(){\n  CROSS=!CROSS;\n  try{ localStorage.setItem(\"crossHelp\", CROSS?\"on\":\"off\"); }catch(e){}\n  const b=$(\"crossBtn\"); b.textContent=crossBtnText(); b.classList.toggle(\"off\",!CROSS);\n  if(!CROSS && G.phase!==\"end\" && cur() && cur().k===\"cross\"){ G.step--; advance(); return; }\n  render(false);\n}\n/* one factor, with its slots */\nfunction xf(F,S,ti,which,i,mode,lc){\n  const lo=lc ? \" lo lo\"+lc : \"\";\n  const sg=F.neg ? '\u003cspan class=\"xsg'+lo+'\">'+M+'\u003c/span>' : \"\";\n  if(F.bare) return sg+'\u003cspan class=\"'+lo+'\">'+F.v+'\u003c/span>';\n  const map=CUR.steps[i].map;\n  const tIt=map[S+\"|\"+ti+\"|\"+which+\"|n\"], bIt=map[S+\"|\"+ti+\"|\"+which+\"|d\"];\n  const slot=function(it){\n    if(!it || it.auto) return '\u003cspan class=\"xslot\">\u003c/span>';\n    if(mode===\"ask\") return '\u003cspan class=\"xslot\">'+inputHTML(i,it.id,{t:\"num\",w:String(it.w)},\"hlb\"+it.c)+'\u003c/span>';\n    return '\u003cspan class=\"xslot\">\u003cspan class=\"'+(mode===\"write\"?\"blue fresh\":\"xnew\")+lo+'\">'+it.w+'\u003c/span>\u003c/span>';\n  };\n  const num=function(txt,it){ const cls=!it ? lo : it.auto ? \" cx-old\" : mode===\"ask\" ? \" hl\"+it.c : \" cx-old\";\n    const pd=(it && /cx-old/.test(cls)) ? ' data-pid=\"'+i+'-'+it.pid+'\"' : \"\";\n    return '\u003cspan class=\"xnum'+cls+'\"'+pd+'>'+txt+'\u003c/span>'; };\n  const top=F.txt!=null ? F.txt : (F.vin ? (F.n===1?\"\":F.n)+F.vin : String(F.n));\n  let h='\u003cspan class=\"xfrac\">'+s const sg20b=f=>q8(f&&{q1:3,p1:1,q2:6,p2:5,c1:6,c2:1});

const GENS=[sg1,sg2,sg3,q4,q7,q8,sg7b,q21,sg9b,sg10b,q12,q13,q14,sg14,sg15,sg16,q3,sg18,sg19,sg20b,sg21,sg22,sg23,sg24,sg25,sg26];
const TOTAL=GENS.length, LABEL=i=>String(i+1);

/* ======================= state ======================= */
const S={i:0,Q:[],ti:false,autoShown:false,ans:{},got:new Set()};
/* the answer to each question the student has worked all the way through (a later question can show it) */
const keepAns=q=>{const i=S.Q.indexOf(q);if(i>=0){S.ans[i]={q:q,final:q.g.final};S.got.add(i);}};
const ansFor=i=>S.ans[i]&&S.ans[i].q===S.Q[i]?S.ans[i].final:null;
function mkQ(i,orig){const g=GENS[i](orig?1:undefined);g.orig=!!orig;g.pre=g.pre||[];g.post=g.post||[];g.pts=g.pts||'5 pts';if(g.saw===undefined)g.saw=true;
  return {g:g,phase:g.pre.length?'pre':'eng',step:0,done:false,engDone:false,frame:null,fb:null};}
/* New numbers: the same kind of question again */
function renew(q,orig){const i=S.Q.indexOf(q);if(i<0)return;if(q.frame)q.frame.remove();S.Q[i]=mkQ(i,orig);if(i===S.i)render();else renderStrip();}
const cur=()=>S.Q[S.i];
const finished=()=>S.got.size;

function renderScore(){$('#score').innerHTML=finished()+' <small>of '+TOTAL+' done</small>';}
function renderStrip(){
  $('#strip').innerHTML='<span class="lab">Question</span>'+S.Q.map((q,i)=>'<button type="button" class="qn'+(S.got.has(i)?' right':'')+(i===S.i?' on':'')+'" data-q="'+i+'" title="'+esc('Question '+(i+1)+': '+q.g.tag+(S.got.has(i)?' (done)':''))+'">'+LABEL(i)+'</button>').join('');
  $('#strip').querySelectorAll('.qn').forEach(b=>b.onclick=()=>{S.i=+b.dataset.q;render();});
}
function renderCard(q){
  const c=$('#qcard'),eng=q.phase==='eng';
  const u=q.g.uses,pa=u!==undefined?ansFor(u):null,prev=pa?'<p class="prevans">Your answer to Question '+(u+1)+': <b>'+pa+'</b></p>':'';
  c.innerHTML='<div class="qhead"><span>Question '+(S.i+1)+'</span></div><div class="qbody">'+q.g.stem+prev+'</div>';
  /* while the drill is working the problem, it shows the equation, so the bar doesn't repeat it.
     If all that's left is "Solve.", the bar is just the question number. */
  const t=document.createElement('div');t.innerHTML=q.g.stem;t.querySelectorAll('.qeq,.blank').forEach(x=>x.remove());
  const rest=t.textContent.replace(/\s+/g,' ').trim();
  c.className='qcard'+(eng?' ineng':'')+(eng&&(!rest||/^((solve|what is the solution to)( the equation( below)?)?( for( the value of)? \w)?|solve for \w)\??\.?$/i.test(rest))?' bare':'');
}
function renderStatus(q){
  const st=$('#status');st.classList.toggle('done',q.done);
  $('#origBtn').hidden=q.g.orig;
  st.innerHTML=q.done?'<div class="ok">✓ '+q.g.final+'</div><div class="note">Done.</div>':'';
}
/* the drill, with this question in it */
function srcdocFor(q){
  const spec=Object.assign({},q.g.eng.spec,{nextLabel:q.g.post.length?'Next &rarr;':nextLabel()});
  const js=JSON.stringify(spec).replace(/<\//g,'<\\/');
  return ENG[q.g.eng.type].replace('/*SPEC*/','window.HOST_SPEC='+js+';');
}
function showFrame(q){
  [...$('#frames').children].forEach(f=>{f.style.display=(q&&f===q.frame)?'':'none';});
  if(q&&q.frame){ setTimeout(()=>{ try{q.frame.focus();q.frame.contentWindow.postMessage({refit:1,focus:1},'*');}catch(e){} },30); }
}
function render(){
  const q=cur();
  if(q.g.skipIfAnswered&&q.phase==='eng'&&!q.frame&&ansFor(q.g.uses)){q.phase='post';q.step=0;q.engDone=true;}
  renderScore();renderStrip();renderCard(q);renderStatus(q);
  const hp=$('#hpanel');
  if(q.phase==='eng'){
    hp.hidden=true;
    if(!q.frame){const f=document.createElement('iframe');f.title='Work it out';f.setAttribute('srcdoc',srcdocFor(q));
      /* once the drill has loaded: the cursor goes straight into its first box */
      f.addEventListener('load',()=>{if(q===cur()&&q.frame===f&&!S.ti){try{f.focus();f.contentWindow.postMessage({focus:1},'*');}catch(e){}}});
      $('#frames').appendChild(f);q.frame=f;}
    showFrame(q);
  } else {
    showFrame(null);hp.hidden=false;renderPanel(q);
  }
}
function curStep(q){return q.phase==='pre'?q.g.pre[q.step]:q.phase==='post'?q.g.post[q.step]:null;}
function renderPanel(q){
  const hp=$('#hpanel');
  if(q.done){
    hp.innerHTML='<div class="hp-done"><span class="big">✓ '+q.g.final+'</span></div><button class="next" id="hpNext" type="button">'+nextLabel()+'</button>';
    $('#hpNext').onclick=goNext;setTimeout(()=>$('#hpNext').focus(),30);return;
  }
  const s=curStep(q);
  let h='<div class="hp-lab">'+(q.phase==='post'?'One more question':'Set it up')+'</div>'+(s.table||'')+'<p class="hp-q">'+s.prompt+'</p>';
  if(s.type==='choice'&&s.menu) h+='<select class="menu" id="hpMenu" aria-label="Your answer"><option value="">Choose…</option>'+s.opts.map((o,i)=>'<option value="'+i+'"'+(s.wrong.indexOf(i)>=0?' disabled':'')+'>'+esc(o.t)+'</option>').join('')+'</select>';
  else if(s.type==='choice') h+='<div class="opts">'+s.opts.map((o,i)=>{const w=s.wrong.indexOf(i)>=0;return '<button type="button" class="opt'+(w?' wrong':'')+'" data-i="'+i+'"'+(w?' disabled':'')+'>'+esc(o.t)+'</button>';}).join('')+'</div>';
  if(s.type==='ask') h+='<div class="fields">'+s.fields.map((f,i)=>'<div class="field"><label for="hf'+i+'">'+esc(f.label)+'</label><input class="box'+(f.ok?' ok':'')+'" id="hf'+i+'" value="'+esc(f.val||'')+'" autocomplete="off" inputmode="decimal">'+(f.after?'<span>'+esc(f.after)+'</span>':'')+'</div>').join('')+'</div>';
  if(s.type==='rows'&&s.opts) h+=s.rows.map((r,i)=>'<div class="srow"><p class="m" style="font-size:1.2rem">'+(i+1)+'.&nbsp; '+r.html+'</p><div class="sline">'
    +s.opts.map(o=>{const w=r.wrong.indexOf(o.v)>=0,ok=r.done&&r.want===o.v;return '<button type="button" class="sg'+(ok?' right':'')+(w?' wrong':'')+'" style="padding:0 .7em" data-r="'+i+'" data-s="'+o.v+'"'+(r.done||w?' disabled':'')+'>'+esc(o.t)+'</button>';}).join('')+'</div></div>').join('');
  else if(s.type==='rows') h+=s.rows.map((r,i)=>'<div class="srow"><p>'+(i+1)+'. '+esc(r.text)+'</p><div class="sline"><span>x</span>'
    +['<','>','<=','>='].map(sg=>{const w=r.wrong.indexOf(sg)>=0,ok=r.done&&r.want===sg;return '<button type="button" class="sg'+(ok?' right':'')+(w?' wrong':'')+'" data-r="'+i+'" data-s="'+sg+'"'+(r.done||w?' disabled':'')+'>'+esc(SYMT[sg])+'</button>';}).join('')
    +'<span>'+r.n+'</span></div></div>').join('');
  if(q.fb) h+='<p class="hp-fb">✗ '+q.fb+'</p>';
  hp.innerHTML=h;
  hp.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(q,s,+b.dataset.i));
  const mn=$('#hpMenu');if(mn){mn.onchange=()=>{if(mn.value!=='')pickOpt(q,s,+mn.value);};setTimeout(()=>mn.focus(),30);}
  hp.querySelectorAll('.sg').forEach(b=>b.onclick=()=>pickRow(q,s,+b.dataset.r,b.dataset.s));
  if(s.type==='ask'){
    s.fields.forEach((f,i)=>{const el=$('#hf'+i);
      el.oninput=()=>{f.val=el.value;el.classList.remove('bad');const v=parseFloat(el.value.replace(/[$,\s]/g,'').replace(/[−]/g,'-'));f.ok=!isNaN(v)&&Math.abs(v-f.w)<1e-9;el.classList.toggle('ok',f.ok);
        if(f.ok){const nx=s.fields.find(x=>!x.ok);if(nx)$('#hf'+s.fields.indexOf(nx)).focus();else setTimeout(()=>stepDone(q),300);}};
      el.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();if(!el.value.trim())return;if(!f.ok){el.classList.add('bad');miss(q,s.hint);}};
    });
    const first=s.fields.find(x=>!x.ok);if(first)setTimeout(()=>$('#hf'+s.fields.indexOf(first)).focus(),30);
  }
}
/* a wrong pick just gets a note: try again */
function miss(q,why){q.fb=why;renderPanel(q);}
function finish(q){keepAns(q);q.phase='done';q.done=true;q.fb=null;celebrate();render();}
function stepDone(q){
  q.fb=null;q.step++;
  const list=q.phase==='pre'?q.g.pre:q.g.post;
  if(q.step>=list.length){
    q.step=0;
    if(q.phase==='pre'&&q.g.eng){q.phase='eng';render();return;}
    finish(q);return;
  }
  render();
}
function pickOpt(q,s,i){const o=s.opts[i];if(!o.ok){if(s.wrong.indexOf(i)<0)s.wrong.push(i);miss(q,o.why||'Not that one.');return;}stepDone(q);}
function pickRow(q,s,i,sg){const r=s.rows[i];if(r.done)return;
  if(sg===r.want){r.done=true;q.fb=null;}else{r.wrong.push(sg);q.fb=(i+1)+'. '+(r.why||MEANING[r.want](r.clue,r.n));}
  if(s.rows.every(x=>x.done)){if(!q.g.eng){finish(q);return;}stepDone(q);return;}
  renderPanel(q);}
function nextLabel(){if(S.i===TOTAL-1)return 'Back to Question '+LABEL(S.Q.findIndex((q,j)=>!S.got.has(j))<0?0:S.Q.findIndex((q,j)=>!S.got.has(j)))+' &rarr;';return 'Question '+LABEL(S.i+1)+' &rarr;';}
function goNext(){
  if(S.i<TOTAL-1)S.i++;else{const k=S.Q.findIndex((q,j)=>!S.got.has(j));S.i=k<0?0:k;}
  render();
}
function celebrate(){
  const old=document.querySelector('.big-ok');if(old)old.remove();
  const el=document.createElement('div');el.className='big-ok';el.setAttribute('aria-hidden','true');
  el.innerHTML='<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="bo-c"/><path d="M34 62 L52 80 L87 42" class="bo-k"/></svg>';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
}
/* messages from the drill working the problem: done (solved), next (the student pressed Next) */
window.addEventListener('message',e=>{
  const d=e.data;if(!d||!d.drill)return;
  const q=S.Q.find(x=>x.frame&&x.frame.contentWindow===e.source);if(!q)return;
  if(d.done&&!q.engDone){q.engDone=true;if(!q.g.post.length&&!q.done){keepAns(q);q.done=true;celebrate();}}
  if(d.next){
    if(q.engDone&&q.g.post.length&&q.phase==='eng'){q.phase='post';q.step=0;if(q===cur())render();return;}
    if(q.done&&q===cur()&&!S.ti){goNext();return;}
  }
  renderScore();renderStrip();if(q===cur())renderStatus(q);
});

$('#newBtn').onclick=()=>renew(cur());
$('#origBtn').onclick=()=>renew(cur(),true);
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const a=document.activeElement;if(a&&a.tagName==='INPUT')return;
  const q=cur();if(q.done&&q.phase==='done'&&(e.key==='Enter'||e.key==='n'||e.key==='N')){e.preventDefault();goNext();}
});
GENS.forEach((g,i)=>S.Q.push(mkQ(i,true)));
render();
window.__host={S:S,mkQ:mkQ};
})();
</script>

</body></html>
